[project]
name = "novacrm-onboarding"
version = "0.1.0"
description = "Agentic customer-onboarding automation for NovaCRM: Gmail intake, voice tier confirmation, Rocketlane project, Slack channel."
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
novacrm = "novacrm.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "types-PyYAML", "markdown>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novacrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true
