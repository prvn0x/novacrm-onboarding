# The onboarding plan (design doc §9): 4 phases, 15 tasks, both tiers.
#
# Used two ways:
#  - ROCKETLANE mode "template": build the two Rocketlane templates from this file by hand
#    (docs/ROCKETLANE_SETUP.md); the agent applies the template through the API.
#  - ROCKETLANE mode "api": the agent creates every phase and task from this file through the
#    API (POST /phases, POST /tasks, POST /tasks/{id}/add-dependencies). No template needed.
#
# Days are offsets from the project start: [start_day, end_day]. owner: pm = the CSM (Project
# Manager), customer = the customer contact.

durations: {enterprise: 30, growth: 14}

phases:
  - name: Kickoff
    tasks:
      - {name: "Internal handoff review with the AE", owner: pm,
         enterprise: [0, 1], growth: [0, 0],
         description: "Scope, success criteria and risks from the deal; read the AE's notes."}
      - {name: "Schedule and run the kickoff call", owner: pm,
         enterprise: [1, 3], growth: [1, 2]}
      - {name: "Agree success criteria and the go-live date", owner: pm,
         enterprise: [3, 5], growth: [2, 2]}
      - {name: "Share the onboarding plan and set up customer admin access", owner: pm,
         enterprise: [3, 5], growth: [2, 2]}
  - name: Data Migration
    tasks:
      - {name: "Collect data exports and agree the field mapping", owner: customer,
         enterprise: [5, 9], growth: [3, 4]}
      - {name: "Test import into a sandbox", owner: pm,
         enterprise: [9, 12], growth: [5, 5]}
      - {name: "Full data import", owner: pm,
         enterprise: [12, 15], growth: [6, 6]}
      - {name: "Customer data verification sign-off", owner: customer,
         enterprise: [15, 17], growth: [7, 7],
         description: "Record counts and a sample check of the migrated data, confirmed by the customer. Go-live readiness depends on this task."}
  - name: Configuration
    tasks:
      - {name: "Configure pipelines, fields and user roles", owner: pm,
         enterprise: [15, 20], growth: [6, 8]}
      - {name: "Set up integrations", owner: pm,
         enterprise: [18, 22], growth: [8, 9],
         description: "Enterprise: email, calendar and SSO. Growth: email and calendar."}
      - {name: "Training", owner: pm,
         enterprise: [20, 25], growth: [9, 10],
         description: "Enterprise: live admin and end-user sessions. Growth: one group session plus recordings."}
  - name: Go-Live
    tasks:
      - {name: "User acceptance testing with the customer's champions", owner: customer,
         enterprise: [24, 27], growth: [10, 11]}
      - {name: "Go-live readiness check", owner: pm,
         enterprise: [27, 28], growth: [12, 12],
         depends_on: "Customer data verification sign-off"}
      - {name: "Go-live and hypercare", owner: pm,
         enterprise: [28, 30], growth: [12, 14]}
      - {name: "Handoff summary and transfer to Support", owner: pm,
         enterprise: [30, 30], growth: [14, 14]}
